      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="22%" r="55%">
      <stop offset="0" stop-color="#2ED6A1" stop-opacity="0.20"/>
